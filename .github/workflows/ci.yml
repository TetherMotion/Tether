name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  compile:
    name: Compile Debug Build
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          g++ \
          gcc \
          libc6-dev \
          libboost-dev \
          make
    
    - name: Configure and build
      run: |
        cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=Debug \
          -DTETHER_BUILD_TESTS=ON \
          -DTETHER_BUILD_SIMULATION=ON \
          -DTETHER_BUILD_ETHERCAT_MASTER=ON \
          -DTETHER_BUILD_DESTABILIZER=ON \
          -DTETHER_BUILD_PYTHON_BINDINGS=OFF \
          -DTETHER_BUILD_EXTRACT_ESI=OFF
        cmake --build build --parallel $(nproc)
    
    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: debug-build
        path: build/

  compile-static:
    name: Compile Static Build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          g++ \
          gcc \
          libc6-dev \
          libboost-dev \
          make

    - name: Configure and build (static only)
      run: |
        cmake -S . -B build-static \
          -DCMAKE_BUILD_TYPE=Debug \
          -DTETHER_BUILD_SHARED_LIBS=OFF \
          -DTETHER_BUILD_STATIC_LIBS=ON \
          -DTETHER_BUILD_TESTS=ON \
          -DTETHER_BUILD_SIMULATION=ON \
          -DTETHER_BUILD_ETHERCAT_MASTER=ON \
          -DTETHER_BUILD_DESTABILIZER=ON \
          -DTETHER_BUILD_PYTHON_BINDINGS=OFF \
          -DTETHER_BUILD_EXTRACT_ESI=OFF
        cmake --build build-static --parallel $(nproc)

    - name: Upload static build artifact
      uses: actions/upload-artifact@v4
      with:
        name: static-build
        path: build-static/

  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    needs: compile
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: debug-build
        path: build/
    
    - name: Restore executable permissions
      run: |
        # upload-artifact/download-artifact does not preserve the executable
        # bit, so the test binaries need to be made executable again.
        chmod -R +x build/bin
    
    - name: Run tests
      run: .github/scripts/run_ctest.sh build

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: unit-test-results
        path: |
          build/Testing/
          build/ctest_full.log

  integration-tests:
    name: Run Integration Tests
    runs-on: ubuntu-latest
    needs: compile
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: debug-build
        path: build/
    
    - name: Restore executable permissions
      run: |
        # upload-artifact/download-artifact does not preserve the executable
        # bit, so the test binaries need to be made executable again.
        chmod -R +x build/bin
    
    - name: Run integration tests
      run: .github/scripts/run_ctest.sh build "" -R "integration|ethercat|simulation"

    - name: Upload integration test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: integration-test-results
        path: |
          build/Testing/
          build/ctest_full.log

  coverage:
    name: Generate Code Coverage
    runs-on: ubuntu-latest
    needs: compile
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          g++ \
          gcc \
          libc6-dev \
          make \
          lcov \
          gcovr
    
    - name: Configure and build with coverage
      run: |
        cmake -S . -B build-coverage \
          -DCMAKE_BUILD_TYPE=Debug \
          -DTETHER_BUILD_TESTS=ON \
          -DTETHER_BUILD_SIMULATION=ON \
          -DTETHER_BUILD_ETHERCAT_MASTER=ON \
          -DTETHER_BUILD_DESTABILIZER=ON \
          -DTETHER_ENABLE_COVERAGE=ON \
          -DTETHER_BUILD_PYTHON_BINDINGS=OFF \
          -DTETHER_BUILD_EXTRACT_ESI=OFF
        cmake --build build-coverage --parallel $(nproc)
    
    - name: Run tests
      run: .github/scripts/run_ctest.sh build-coverage
    
    - name: Generate coverage report with lcov
      run: |
        # lcov 2.0 is strict about gcov warnings/negative counts/mismatched
        # line ranges emitted for system headers (libstdc++) and optimized
        # test bodies. --ignore-errors lets the capture proceed and
        # --rc geninfo_unexecuted_blocks=1 silences the noisy warnings.
        lcov --directory build-coverage --capture --output-file coverage.info \
          --ignore-errors gcov,negative,gcov_warnings,mismatch \
          --rc geninfo_unexecuted_blocks=1
        lcov --remove coverage.info '/usr/*' --output-file coverage.info \
          --ignore-errors unused
        lcov --remove coverage.info '*/_deps/*' --output-file coverage.info \
          --ignore-errors unused
        lcov --remove coverage.info '*/tests/*' --output-file coverage.info \
          --ignore-errors unused
        lcov --list coverage.info
    
    - name: Generate coverage report with gcovr
      run: |
        # gcovr 6.x (Ubuntu 24.04) removed --build-directory; the build
        # directory is now a positional argument.
        # --gcov-ignore-parse-errors works around a gcov tool bug that
        # emits negative hit values (branch taken -1), see
        # https://gcc.gnu.org/bugzilla/show_bug.cgi?id=68080.
        gcovr --root . --xml --output coverage.xml build-coverage \
          --gcov-ignore-parse-errors negative_hits.warn
        gcovr --root . --html --output coverage.html build-coverage \
          --gcov-ignore-parse-errors negative_hits.warn
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage.info,./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
    
    - name: Upload coverage artifacts
      uses: actions/upload-artifact@v4
      with:
        name: coverage-reports
        path: |
          coverage.info
          coverage.xml
          coverage.html

  asan-tests:
    name: Run Module Tests with ASAN
    runs-on: ubuntu-latest
    needs: compile
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          g++ \
          gcc \
          libc6-dev \
          make \
          ccache
    
    - name: Configure ccache
      run: |
        echo "CCACHE_DIR=~/.cache/ccache" >> $GITHUB_ENV
        ccache -M 5G
        ccache -s
    
    - name: Configure and build with ASAN
      run: |
        SANITIZER_FLAGS="-fsanitize=address -fno-omit-frame-pointer -g"
        
        cmake -S . -B build-asan \
          -DCMAKE_BUILD_TYPE=Debug \
          -DTETHER_BUILD_TESTS=ON \
          -DTETHER_BUILD_MODULE_TESTS=ON \
          -DTETHER_BUILD_DESTABILIZER=ON \
          -DTETHER_BUILD_PYTHON_BINDINGS=OFF \
          -DTETHER_BUILD_EXTRACT_ESI=OFF \
          -DCMAKE_CXX_FLAGS="${SANITIZER_FLAGS}" \
          -DCMAKE_C_FLAGS="${SANITIZER_FLAGS}" \
          -DCMAKE_EXE_LINKER_FLAGS="${SANITIZER_FLAGS}" \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          
        # Build every test target that the project defines. The per-module
        # target names are split (e.g. tether_control_core_tests,
        # tether_simulation_systems_tests, ...) so building "all" is the
        # robust way to pick up every module test executable.
        cmake --build build-asan --parallel $(nproc)
    
    - name: Run all module tests with ASAN
      run: |
        export ASAN_OPTIONS=detect_leaks=1:halt_on_error=0
        .github/scripts/run_ctest.sh build-asan asan_all.log --parallel $(nproc)

    - name: Show ccache stats
      if: always()
      run: ccache -s

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: asan-test-results
        path: |
          asan_all.log
          build-asan/ctest_full.log

  tsan-tests:
    name: Run Module Tests with TSAN
    runs-on: ubuntu-latest
    needs: compile
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          g++ \
          gcc \
          libc6-dev \
          make \
          ccache
    
    - name: Configure ccache
      run: |
        echo "CCACHE_DIR=~/.cache/ccache" >> $GITHUB_ENV
        ccache -M 5G
        ccache -s
    
    - name: Configure and build with TSAN
      run: |
        SANITIZER_FLAGS="-fsanitize=thread -g"
        
        cmake -S . -B build-tsan \
          -DCMAKE_BUILD_TYPE=Debug \
          -DTETHER_BUILD_TESTS=ON \
          -DTETHER_BUILD_MODULE_TESTS=ON \
          -DTETHER_BUILD_DESTABILIZER=ON \
          -DTETHER_BUILD_PYTHON_BINDINGS=OFF \
          -DTETHER_BUILD_EXTRACT_ESI=OFF \
          -DCMAKE_CXX_FLAGS="${SANITIZER_FLAGS}" \
          -DCMAKE_C_FLAGS="${SANITIZER_FLAGS}" \
          -DCMAKE_EXE_LINKER_FLAGS="${SANITIZER_FLAGS}" \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          
        # Build every test target that the project defines. The per-module
        # target names are split (e.g. tether_control_core_tests,
        # tether_simulation_systems_tests, ...) so building "all" is the
        # robust way to pick up every module test executable.
        cmake --build build-tsan --parallel $(nproc)
    
    - name: Run all module tests with TSAN
      run: |
        export TSAN_OPTIONS=halt_on_error=0
        .github/scripts/run_ctest.sh build-tsan tsan_all.log --parallel $(nproc)

    - name: Show ccache stats
      if: always()
      run: ccache -s

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: tsan-test-results
        path: |
          tsan_all.log
          build-tsan/ctest_full.log

  analyze-test-timing:
    name: Analyze Test Timing
    runs-on: ubuntu-latest
    needs: compile

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: debug-build
        path: build/

    - name: Restore executable permissions
      run: |
        chmod -R +x build/bin

    - name: Run tests with timing output and analyze
      run: python3 .github/scripts/analyze_test_timing.py
      env:
        BUILD_DIR: build
        TOP_N: 50

    - name: Upload timing analysis results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-timing-analysis
        path: build/timing_results/
