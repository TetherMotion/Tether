name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  compile:
    name: Compile Debug Build
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Hash submodule pins
      id: submod-key
      run: echo "hash=$(git ls-tree HEAD dependencies | git hash-object --stdin)" >> "$GITHUB_OUTPUT"

    - name: Restore submodule object cache
      id: submodule-cache
      uses: actions/cache/restore@v6
      with:
        path: .git/modules
        # Key on the pinned submodule commits (gitlinks), not the commit
        # SHA: one cache entry per submodule pin-set instead of one per
        # commit per job. Per-SHA entries wrote ~123 MB x N jobs every
        # push, exceeding the 10 GB quota and evicting the ccache entries.
        key: submodules-${{ steps.submod-key.outputs.hash }}
        restore-keys: submodules-

    - name: Update submodules
      run: git submodule update --init --recursive

    - name: Save submodule object cache
      uses: actions/cache/save@v6
      if: steps.submodule-cache.outputs.cache-hit != 'true'
      with:
        path: .git/modules
        key: submodules-${{ steps.submod-key.outputs.hash }}
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          g++ \
          gcc \
          libc6-dev \
          libboost-dev \
          make \
          ccache \
          lld \
          mold \
          ninja-build
    
    - name: Cache googletest source
      uses: actions/cache@v6
      with:
        path: .deps-src/googletest
        key: googletest-v1.14.0

    - name: Provide googletest to FetchContent
      run: |
        if [ ! -d .deps-src/googletest ]; then
          git clone --depth 1 --branch v1.14.0 \
            https://github.com/google/googletest.git .deps-src/googletest
        fi
        echo "FETCHCONTENT_SOURCE_DIR_GOOGLETEST=${{ github.workspace }}/.deps-src/googletest" >> "$GITHUB_ENV"

    - name: Restore ccache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ccache
        key: ccache-${{ github.job }}${{ matrix.os && format('-{0}', matrix.os) || '' }}-${{ github.sha }}
        restore-keys: ccache-${{ github.job }}${{ matrix.os && format('-{0}', matrix.os) || '' }}-

    - name: Configure ccache
      run: |
        echo "CCACHE_DIR=~/.cache/ccache" >> $GITHUB_ENV
        ccache -M 5G
        ccache -s

    - name: Configure and build
      run: |
        # mold is the fastest supported linker (needs GCC 12+/clang);
        # GCC 11 (ubuntu-22.04) rejects -fuse-ld=mold, so fall back to lld.
        if echo 'int main(){}' | ${CXX:-c++} -x c++ - -fuse-ld=mold -o /tmp/ldprobe 2>/dev/null; then
          LINKER_FLAG=-fuse-ld=mold
        else
          LINKER_FLAG=-fuse-ld=lld
        fi
        echo "Using linker: $LINKER_FLAG"
        echo "LINKER_FLAG=$LINKER_FLAG" >> "$GITHUB_ENV"
        cmake -S . -B build \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DCMAKE_EXE_LINKER_FLAGS="$LINKER_FLAG" \
          -DCMAKE_SHARED_LINKER_FLAGS="$LINKER_FLAG" \
          -DCMAKE_MODULE_LINKER_FLAGS="$LINKER_FLAG" \
          -DTETHER_BUILD_TESTS=ON \
          -DTETHER_BUILD_SIMULATION=ON \
          -DTETHER_BUILD_ETHERCAT_MASTER=ON \
          -DTETHER_BUILD_DESTABILIZER=ON \
          -DTETHER_BUILD_PYTHON_BINDINGS=OFF \
          -DTETHER_BUILD_EXTRACT_ESI=OFF
        cmake --build build --parallel $(nproc)
        # Test executables are EXCLUDE_FROM_ALL; without this the
        # gtest_discover_tests post-build step never runs and ctest only
        # sees <name>_NOT_BUILT placeholder tests.
        cmake --build build --target tests --parallel $(nproc)
    
    - name: Upload build artifact
      uses: actions/upload-artifact@v7
      with:
        name: debug-build
        path: build/

  compile-static:
    name: Compile Static Build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Hash submodule pins
      id: submod-key
      run: echo "hash=$(git ls-tree HEAD dependencies | git hash-object --stdin)" >> "$GITHUB_OUTPUT"

    - name: Restore submodule object cache
      id: submodule-cache
      uses: actions/cache/restore@v6
      with:
        path: .git/modules
        # Key on the pinned submodule commits (gitlinks), not the commit
        # SHA: one cache entry per submodule pin-set instead of one per
        # commit per job. Per-SHA entries wrote ~123 MB x N jobs every
        # push, exceeding the 10 GB quota and evicting the ccache entries.
        key: submodules-${{ steps.submod-key.outputs.hash }}
        restore-keys: submodules-

    - name: Update submodules
      run: git submodule update --init --recursive

    - name: Save submodule object cache
      uses: actions/cache/save@v6
      if: steps.submodule-cache.outputs.cache-hit != 'true'
      with:
        path: .git/modules
        key: submodules-${{ steps.submod-key.outputs.hash }}

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          g++ \
          gcc \
          libc6-dev \
          libboost-dev \
          make \
          ccache \
          lld \
          mold \
          ninja-build

    - name: Cache googletest source
      uses: actions/cache@v6
      with:
        path: .deps-src/googletest
        key: googletest-v1.14.0

    - name: Provide googletest to FetchContent
      run: |
        if [ ! -d .deps-src/googletest ]; then
          git clone --depth 1 --branch v1.14.0 \
            https://github.com/google/googletest.git .deps-src/googletest
        fi
        echo "FETCHCONTENT_SOURCE_DIR_GOOGLETEST=${{ github.workspace }}/.deps-src/googletest" >> "$GITHUB_ENV"

    - name: Restore ccache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ccache
        key: ccache-${{ github.job }}${{ matrix.os && format('-{0}', matrix.os) || '' }}-${{ github.sha }}
        restore-keys: ccache-${{ github.job }}${{ matrix.os && format('-{0}', matrix.os) || '' }}-

    - name: Configure ccache
      run: |
        echo "CCACHE_DIR=~/.cache/ccache" >> $GITHUB_ENV
        ccache -M 5G
        ccache -s

    - name: Configure and build (static only)
      run: |
        # mold is the fastest supported linker (needs GCC 12+/clang);
        # GCC 11 (ubuntu-22.04) rejects -fuse-ld=mold, so fall back to lld.
        if echo 'int main(){}' | ${CXX:-c++} -x c++ - -fuse-ld=mold -o /tmp/ldprobe 2>/dev/null; then
          LINKER_FLAG=-fuse-ld=mold
        else
          LINKER_FLAG=-fuse-ld=lld
        fi
        echo "Using linker: $LINKER_FLAG"
        echo "LINKER_FLAG=$LINKER_FLAG" >> "$GITHUB_ENV"
        cmake -S . -B build-static \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DCMAKE_EXE_LINKER_FLAGS="$LINKER_FLAG" \
          -DCMAKE_SHARED_LINKER_FLAGS="$LINKER_FLAG" \
          -DCMAKE_MODULE_LINKER_FLAGS="$LINKER_FLAG" \
          -DTETHER_BUILD_SHARED_LIBS=OFF \
          -DTETHER_BUILD_STATIC_LIBS=ON \
          -DTETHER_BUILD_TESTS=ON \
          -DTETHER_BUILD_SIMULATION=ON \
          -DTETHER_BUILD_ETHERCAT_MASTER=ON \
          -DTETHER_BUILD_DESTABILIZER=ON \
          -DTETHER_BUILD_PYTHON_BINDINGS=OFF \
          -DTETHER_BUILD_EXTRACT_ESI=OFF
        cmake --build build-static --parallel $(nproc)
        cmake --build build-static --target tests --parallel $(nproc)

    - name: Upload static build artifact
      uses: actions/upload-artifact@v7
      with:
        name: static-build
        path: build-static/

  compile-matrix:
    name: Compile (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Hash submodule pins
      id: submod-key
      run: echo "hash=$(git ls-tree HEAD dependencies | git hash-object --stdin)" >> "$GITHUB_OUTPUT"

    - name: Restore submodule object cache
      id: submodule-cache
      uses: actions/cache/restore@v6
      with:
        path: .git/modules
        # Key on the pinned submodule commits (gitlinks), not the commit
        # SHA: one cache entry per submodule pin-set instead of one per
        # commit per job. Per-SHA entries wrote ~123 MB x N jobs every
        # push, exceeding the 10 GB quota and evicting the ccache entries.
        key: submodules-${{ steps.submod-key.outputs.hash }}
        restore-keys: submodules-

    - name: Update submodules
      run: git submodule update --init --recursive

    - name: Save submodule object cache
      uses: actions/cache/save@v6
      if: steps.submodule-cache.outputs.cache-hit != 'true'
      with:
        path: .git/modules
        key: submodules-${{ steps.submod-key.outputs.hash }}

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          g++ \
          gcc \
          libc6-dev \
          libboost-dev \
          make \
          ccache \
          lld \
          mold \
          ninja-build

    - name: Show toolchain versions
      run: |
        echo "=== g++ ==="
        g++ --version | head -1
        echo "=== cmake ==="
        cmake --version | head -1

    - name: Cache googletest source
      uses: actions/cache@v6
      with:
        path: .deps-src/googletest
        key: googletest-v1.14.0

    - name: Provide googletest to FetchContent
      run: |
        if [ ! -d .deps-src/googletest ]; then
          git clone --depth 1 --branch v1.14.0 \
            https://github.com/google/googletest.git .deps-src/googletest
        fi
        echo "FETCHCONTENT_SOURCE_DIR_GOOGLETEST=${{ github.workspace }}/.deps-src/googletest" >> "$GITHUB_ENV"

    - name: Restore ccache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ccache
        key: ccache-${{ github.job }}${{ matrix.os && format('-{0}', matrix.os) || '' }}-${{ github.sha }}
        restore-keys: ccache-${{ github.job }}${{ matrix.os && format('-{0}', matrix.os) || '' }}-

    - name: Configure ccache
      run: |
        echo "CCACHE_DIR=~/.cache/ccache" >> $GITHUB_ENV
        ccache -M 5G
        ccache -s

    - name: Configure and build
      run: |
        # mold is the fastest supported linker (needs GCC 12+/clang);
        # GCC 11 (ubuntu-22.04) rejects -fuse-ld=mold, so fall back to lld.
        if echo 'int main(){}' | ${CXX:-c++} -x c++ - -fuse-ld=mold -o /tmp/ldprobe 2>/dev/null; then
          LINKER_FLAG=-fuse-ld=mold
        else
          LINKER_FLAG=-fuse-ld=lld
        fi
        echo "Using linker: $LINKER_FLAG"
        echo "LINKER_FLAG=$LINKER_FLAG" >> "$GITHUB_ENV"
        cmake -S . -B build \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DCMAKE_EXE_LINKER_FLAGS="$LINKER_FLAG" \
          -DCMAKE_SHARED_LINKER_FLAGS="$LINKER_FLAG" \
          -DCMAKE_MODULE_LINKER_FLAGS="$LINKER_FLAG" \
          -DTETHER_BUILD_TESTS=ON \
          -DTETHER_BUILD_SIMULATION=ON \
          -DTETHER_BUILD_ETHERCAT_MASTER=ON \
          -DTETHER_BUILD_DESTABILIZER=ON \
          -DTETHER_BUILD_PYTHON_BINDINGS=OFF \
          -DTETHER_BUILD_EXTRACT_ESI=OFF
        cmake --build build --parallel $(nproc)
        cmake --build build --target tests --parallel $(nproc)

  integration-tests:
    name: Run Integration Tests
    runs-on: ubuntu-latest
    needs: compile
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Hash submodule pins
      id: submod-key
      run: echo "hash=$(git ls-tree HEAD dependencies | git hash-object --stdin)" >> "$GITHUB_OUTPUT"

    - name: Restore submodule object cache
      id: submodule-cache
      uses: actions/cache/restore@v6
      with:
        path: .git/modules
        # Key on the pinned submodule commits (gitlinks), not the commit
        # SHA: one cache entry per submodule pin-set instead of one per
        # commit per job. Per-SHA entries wrote ~123 MB x N jobs every
        # push, exceeding the 10 GB quota and evicting the ccache entries.
        key: submodules-${{ steps.submod-key.outputs.hash }}
        restore-keys: submodules-

    - name: Update submodules
      run: git submodule update --init --recursive

    - name: Save submodule object cache
      uses: actions/cache/save@v6
      if: steps.submodule-cache.outputs.cache-hit != 'true'
      with:
        path: .git/modules
        key: submodules-${{ steps.submod-key.outputs.hash }}
    
    - name: Download build artifact
      uses: actions/download-artifact@v8
      with:
        name: debug-build
        path: build/
    
    - name: Restore executable permissions
      run: |
        # upload-artifact/download-artifact does not preserve the executable
        # bit, so the test binaries need to be made executable again.
        chmod -R +x build/bin
    
    - name: Run integration tests
      run: .github/scripts/run_ctest.sh build "" -R "integration|ethercat|simulation"

    - name: Upload integration test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: integration-test-results
        path: |
          build/Testing/
          build/ctest_full.log

  privileged-tests:
    name: Privileged Wire/RT Tests
    runs-on: ubuntu-latest
    needs: compile

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Hash submodule pins
      id: submod-key
      run: echo "hash=$(git ls-tree HEAD dependencies | git hash-object --stdin)" >> "$GITHUB_OUTPUT"

    - name: Restore submodule object cache
      id: submodule-cache
      uses: actions/cache/restore@v6
      with:
        path: .git/modules
        # Key on the pinned submodule commits (gitlinks), not the commit
        # SHA: one cache entry per submodule pin-set instead of one per
        # commit per job. Per-SHA entries wrote ~123 MB x N jobs every
        # push, exceeding the 10 GB quota and evicting the ccache entries.
        key: submodules-${{ steps.submod-key.outputs.hash }}
        restore-keys: submodules-

    - name: Update submodules
      run: git submodule update --init --recursive

    - name: Save submodule object cache
      uses: actions/cache/save@v6
      if: steps.submodule-cache.outputs.cache-hit != 'true'
      with:
        path: .git/modules
        key: submodules-${{ steps.submod-key.outputs.hash }}

    - name: Download build artifact
      uses: actions/download-artifact@v8
      with:
        name: debug-build
        path: build/

    - name: Restore executable permissions
      run: chmod -R +x build/bin

    - name: Install iproute2 (veth setup inside tests)
      run: sudo apt-get update && sudo apt-get install -y iproute2

    # Every test in this binary probes its capability at runtime and
    # GTEST_SKIP()s cleanly when absent, so the job is green on any
    # runner while exercising the real kernel path wherever possible:
    # AF_PACKET rings, kernel cBPF demux, veth wire, SCHED_FIFO/DEADLINE.
    - name: Run privileged tests (rootless netns, or sudo fallback)
      run: |
        BIN=build/bin/tests/tether_ethercat_rt_privileged_tests
        if unshare -rn true 2>/dev/null; then
          echo "::notice::Running under rootless user+net namespace"
          # Fresh netns: full CAP_NET_RAW/CAP_NET_ADMIN over it —
          # veth pairs and AF_PACKET work; RT scheduling self-skips.
          unshare -rn bash -c "ip link set lo up; $BIN"
        else
          echo "::notice::userns unavailable — running under sudo"
          sudo -E "$BIN"
        fi

    - name: Upload privileged test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: privileged-test-results
        path: build/Testing/

  blend-svg-paths:
    name: Generate Test SVG Paths
    runs-on: ubuntu-latest
    needs: compile

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Hash submodule pins
      id: submod-key
      run: echo "hash=$(git ls-tree HEAD dependencies | git hash-object --stdin)" >> "$GITHUB_OUTPUT"

    - name: Restore submodule object cache
      id: submodule-cache
      uses: actions/cache/restore@v6
      with:
        path: .git/modules
        # Key on the pinned submodule commits (gitlinks), not the commit
        # SHA: one cache entry per submodule pin-set instead of one per
        # commit per job. Per-SHA entries wrote ~123 MB x N jobs every
        # push, exceeding the 10 GB quota and evicting the ccache entries.
        key: submodules-${{ steps.submod-key.outputs.hash }}
        restore-keys: submodules-

    - name: Update submodules
      run: git submodule update --init --recursive

    - name: Save submodule object cache
      uses: actions/cache/save@v6
      if: steps.submodule-cache.outputs.cache-hit != 'true'
      with:
        path: .git/modules
        key: submodules-${{ steps.submod-key.outputs.hash }}

    - name: Download build artifact
      uses: actions/download-artifact@v8
      with:
        name: debug-build
        path: build/

    - name: Restore executable permissions
      run: |
        # upload-artifact/download-artifact does not preserve the executable
        # bit, so the test binaries need to be made executable again.
        chmod -R +x build/bin

    - name: Run SVG-generating tests
      run: .github/scripts/run_ctest.sh build "" -R "Blend|G64|ScoringBlend|MotionPlannerArcBlend|VisualSummary"
      env:
        BLEND_SVG_DIR: ${{ github.workspace }}/test_svgs
        TEST_SVG_DIR: ${{ github.workspace }}/test_svgs

    - name: Upload test SVG paths
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-svg-paths
        path: test_svgs/

  asan-tests:
    name: Run Module Tests with ASAN + Coverage
    runs-on: ubuntu-latest
    needs: compile
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Hash submodule pins
      id: submod-key
      run: echo "hash=$(git ls-tree HEAD dependencies | git hash-object --stdin)" >> "$GITHUB_OUTPUT"

    - name: Restore submodule object cache
      id: submodule-cache
      uses: actions/cache/restore@v6
      with:
        path: .git/modules
        # Key on the pinned submodule commits (gitlinks), not the commit
        # SHA: one cache entry per submodule pin-set instead of one per
        # commit per job. Per-SHA entries wrote ~123 MB x N jobs every
        # push, exceeding the 10 GB quota and evicting the ccache entries.
        key: submodules-${{ steps.submod-key.outputs.hash }}
        restore-keys: submodules-

    - name: Update submodules
      run: git submodule update --init --recursive

    - name: Save submodule object cache
      uses: actions/cache/save@v6
      if: steps.submodule-cache.outputs.cache-hit != 'true'
      with:
        path: .git/modules
        key: submodules-${{ steps.submod-key.outputs.hash }}
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          g++ \
          gcc \
          libc6-dev \
          make \
          lcov \
          gcovr \
          ccache \
          lld \
          mold \
          ninja-build
    
    - name: Restore ccache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ccache
        key: ccache-${{ github.job }}-${{ github.sha }}
        restore-keys: ccache-${{ github.job }}-

    - name: Configure ccache
      run: |
        echo "CCACHE_DIR=~/.cache/ccache" >> $GITHUB_ENV
        ccache -M 5G
        ccache -s
    
    - name: Cache googletest source
      uses: actions/cache@v6
      with:
        path: .deps-src/googletest
        key: googletest-v1.14.0

    - name: Provide googletest to FetchContent
      run: |
        if [ ! -d .deps-src/googletest ]; then
          git clone --depth 1 --branch v1.14.0 \
            https://github.com/google/googletest.git .deps-src/googletest
        fi
        echo "FETCHCONTENT_SOURCE_DIR_GOOGLETEST=${{ github.workspace }}/.deps-src/googletest" >> "$GITHUB_ENV"

    - name: Configure and build with ASAN
      run: |
        # mold is the fastest supported linker (needs GCC 12+/clang);
        # GCC 11 (ubuntu-22.04) rejects -fuse-ld=mold, so fall back to lld.
        if echo 'int main(){}' | ${CXX:-c++} -x c++ - -fuse-ld=mold -o /tmp/ldprobe 2>/dev/null; then
          LINKER_FLAG=-fuse-ld=mold
        else
          LINKER_FLAG=-fuse-ld=lld
        fi
        echo "Using linker: $LINKER_FLAG"
        echo "LINKER_FLAG=$LINKER_FLAG" >> "$GITHUB_ENV"
        SANITIZER_FLAGS="-fsanitize=address -fno-omit-frame-pointer -g"
        
        cmake -S . -B build-asan \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DTETHER_BUILD_TESTS=ON \
          -DTETHER_BUILD_MODULE_TESTS=ON \
          -DTETHER_BUILD_DESTABILIZER=ON \
          -DTETHER_ENABLE_COVERAGE=ON \
          -DTETHER_BUILD_PYTHON_BINDINGS=OFF \
          -DTETHER_BUILD_EXTRACT_ESI=OFF \
          -DCMAKE_CXX_FLAGS="${SANITIZER_FLAGS}" \
          -DCMAKE_C_FLAGS="${SANITIZER_FLAGS}" \
          -DCMAKE_EXE_LINKER_FLAGS="${SANITIZER_FLAGS} ${LINKER_FLAG}" \
          -DCMAKE_SHARED_LINKER_FLAGS="$LINKER_FLAG" \
          -DCMAKE_MODULE_LINKER_FLAGS="$LINKER_FLAG" \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          
        # Build the project. The per-module test targets are split
        # (e.g. tether_control_core_tests, tether_simulation_systems_tests)
        # and are all reachable through the `tests` target below.
        cmake --build build-asan --parallel $(nproc)
        # Test executables are EXCLUDE_FROM_ALL, so the `all` target above
        # does NOT build them. Build the `tests` target explicitly —
        # otherwise ctest only finds <name>_NOT_BUILT placeholders.
        cmake --build build-asan --target tests --parallel $(nproc)
    
    - name: Run all module tests with ASAN
      run: |
        export ASAN_OPTIONS=detect_leaks=1:halt_on_error=0
        # Exclude known-slow tests that exceed the per-test timeout under
        # sanitizers (see AGENTS.md): the ThermalIntegrationTest suite
        # (~6 min each, documented slow) and the CertifiedCurvatureSampler
        # brute-force fuzz (20x100k samples). The rest of the curvature
        # sampler suite still runs.
        .github/scripts/run_ctest.sh build-asan asan_all.log \
          --parallel $(nproc) \
          -E "ThermalIntegrationTest|CertifiedBoundDominatesBruteForce"

    # Coverage is collected from this ASAN run: one build+test pass
    # produces both sanitizer results and gcov data instead of a second
    # instrumented build. The ASAN exclusions above also exclude those
    # suites from coverage — acceptable, they contribute little.
    - name: Generate coverage report with lcov
      if: always()
      run: |
        # lcov 2.0 is strict about gcov warnings/negative counts/mismatched
        # line ranges emitted for system headers (libstdc++) and optimized
        # test bodies. --ignore-errors lets the capture proceed and
        # --rc geninfo_unexecuted_blocks=1 silences the noisy warnings.
        # 'inconsistent' covers the bogus function end lines GCC's .gcno
        # emits for gtest TEST bodies (end line = macro invocation line).
        lcov --directory build-asan --capture --output-file coverage.info \
          --ignore-errors gcov,negative,gcov_warnings,mismatch,inconsistent \
          --rc geninfo_unexecuted_blocks=1
        # --remove also needs 'inconsistent': the captured .info carries
        # duplicate libstdc++ function entries (same symbol attributed to
        # different start lines in different TUs) that fail on re-load.
        lcov --remove coverage.info '/usr/*' --output-file coverage.info \
          --ignore-errors unused,inconsistent
        lcov --remove coverage.info '*/_deps/*' --output-file coverage.info \
          --ignore-errors unused,inconsistent
        lcov --remove coverage.info '*/tests/*' --output-file coverage.info \
          --ignore-errors unused,inconsistent
        lcov --list coverage.info --ignore-errors inconsistent

    - name: Generate coverage report with gcovr
      if: always()
      run: |
        # gcovr 6.x (Ubuntu 24.04) removed --build-directory; the build
        # directory is now a positional argument.
        # --gcov-ignore-parse-errors works around a gcov tool bug that
        # emits negative hit values (branch taken -1), see
        # https://gcc.gnu.org/bugzilla/show_bug.cgi?id=68080.
        gcovr --root . --xml --output coverage.xml build-asan \
          --gcov-ignore-parse-errors negative_hits.warn
        gcovr --root . --html --output coverage.html build-asan \
          --gcov-ignore-parse-errors negative_hits.warn

    - name: Upload coverage to Codecov
      if: always()
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.info,./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: Show ccache stats
      if: always()
      run: ccache -s

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: asan-test-results
        path: |
          asan_all.log
          build-asan/ctest_full.log

    - name: Upload coverage artifacts
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: coverage-reports
        path: |
          coverage.info
          coverage.xml
          coverage.html

  tsan-tests:
    name: Run Module Tests with TSAN
    runs-on: ubuntu-latest
    needs: compile
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Hash submodule pins
      id: submod-key
      run: echo "hash=$(git ls-tree HEAD dependencies | git hash-object --stdin)" >> "$GITHUB_OUTPUT"

    - name: Restore submodule object cache
      id: submodule-cache
      uses: actions/cache/restore@v6
      with:
        path: .git/modules
        # Key on the pinned submodule commits (gitlinks), not the commit
        # SHA: one cache entry per submodule pin-set instead of one per
        # commit per job. Per-SHA entries wrote ~123 MB x N jobs every
        # push, exceeding the 10 GB quota and evicting the ccache entries.
        key: submodules-${{ steps.submod-key.outputs.hash }}
        restore-keys: submodules-

    - name: Update submodules
      run: git submodule update --init --recursive

    - name: Save submodule object cache
      uses: actions/cache/save@v6
      if: steps.submodule-cache.outputs.cache-hit != 'true'
      with:
        path: .git/modules
        key: submodules-${{ steps.submod-key.outputs.hash }}
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          g++ \
          gcc \
          libc6-dev \
          make \
          ccache \
          lld \
          mold \
          ninja-build
    
    - name: Restore ccache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ccache
        key: ccache-${{ github.job }}-${{ github.sha }}
        restore-keys: ccache-${{ github.job }}-

    - name: Configure ccache
      run: |
        echo "CCACHE_DIR=~/.cache/ccache" >> $GITHUB_ENV
        ccache -M 5G
        ccache -s
    
    - name: Cache googletest source
      uses: actions/cache@v6
      with:
        path: .deps-src/googletest
        key: googletest-v1.14.0

    - name: Provide googletest to FetchContent
      run: |
        if [ ! -d .deps-src/googletest ]; then
          git clone --depth 1 --branch v1.14.0 \
            https://github.com/google/googletest.git .deps-src/googletest
        fi
        echo "FETCHCONTENT_SOURCE_DIR_GOOGLETEST=${{ github.workspace }}/.deps-src/googletest" >> "$GITHUB_ENV"

    - name: Configure and build with TSAN
      run: |
        # mold is the fastest supported linker (needs GCC 12+/clang);
        # GCC 11 (ubuntu-22.04) rejects -fuse-ld=mold, so fall back to lld.
        if echo 'int main(){}' | ${CXX:-c++} -x c++ - -fuse-ld=mold -o /tmp/ldprobe 2>/dev/null; then
          LINKER_FLAG=-fuse-ld=mold
        else
          LINKER_FLAG=-fuse-ld=lld
        fi
        echo "Using linker: $LINKER_FLAG"
        echo "LINKER_FLAG=$LINKER_FLAG" >> "$GITHUB_ENV"
        SANITIZER_FLAGS="-fsanitize=thread -g"
        
        cmake -S . -B build-tsan \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DTETHER_BUILD_TESTS=ON \
          -DTETHER_BUILD_MODULE_TESTS=ON \
          -DTETHER_BUILD_DESTABILIZER=ON \
          -DTETHER_BUILD_PYTHON_BINDINGS=OFF \
          -DTETHER_BUILD_EXTRACT_ESI=OFF \
          -DCMAKE_CXX_FLAGS="${SANITIZER_FLAGS}" \
          -DCMAKE_C_FLAGS="${SANITIZER_FLAGS}" \
          -DCMAKE_EXE_LINKER_FLAGS="${SANITIZER_FLAGS} ${LINKER_FLAG}" \
          -DCMAKE_SHARED_LINKER_FLAGS="$LINKER_FLAG" \
          -DCMAKE_MODULE_LINKER_FLAGS="$LINKER_FLAG" \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          
        # Build the project. The per-module test targets are split
        # (e.g. tether_control_core_tests, tether_simulation_systems_tests)
        # and are all reachable through the `tests` target below.
        cmake --build build-tsan --parallel $(nproc)
        # Test executables are EXCLUDE_FROM_ALL, so the `all` target above
        # does NOT build them. Build the `tests` target explicitly —
        # otherwise ctest only finds <name>_NOT_BUILT placeholders.
        cmake --build build-tsan --target tests --parallel $(nproc)
    
    - name: Run all module tests with TSAN
      run: |
        export TSAN_OPTIONS=halt_on_error=0
        # Exclude known-slow tests that exceed the per-test timeout under
        # sanitizers (see AGENTS.md): the ThermalIntegrationTest suite
        # (~6 min each, documented slow) and the CertifiedCurvatureSampler
        # brute-force fuzz (20x100k samples). The rest of the curvature
        # sampler suite still runs.
        .github/scripts/run_ctest.sh build-tsan tsan_all.log \
          --parallel $(nproc) \
          -E "ThermalIntegrationTest|CertifiedBoundDominatesBruteForce"

    - name: Show ccache stats
      if: always()
      run: ccache -s

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: tsan-test-results
        path: |
          tsan_all.log
          build-tsan/ctest_full.log

  analyze-test-timing:
    name: Analyze Test Timing
    runs-on: ubuntu-latest
    needs: compile

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Hash submodule pins
      id: submod-key
      run: echo "hash=$(git ls-tree HEAD dependencies | git hash-object --stdin)" >> "$GITHUB_OUTPUT"

    - name: Restore submodule object cache
      id: submodule-cache
      uses: actions/cache/restore@v6
      with:
        path: .git/modules
        # Key on the pinned submodule commits (gitlinks), not the commit
        # SHA: one cache entry per submodule pin-set instead of one per
        # commit per job. Per-SHA entries wrote ~123 MB x N jobs every
        # push, exceeding the 10 GB quota and evicting the ccache entries.
        key: submodules-${{ steps.submod-key.outputs.hash }}
        restore-keys: submodules-

    - name: Update submodules
      run: git submodule update --init --recursive

    - name: Save submodule object cache
      uses: actions/cache/save@v6
      if: steps.submodule-cache.outputs.cache-hit != 'true'
      with:
        path: .git/modules
        key: submodules-${{ steps.submod-key.outputs.hash }}

    - name: Download build artifact
      uses: actions/download-artifact@v8
      with:
        name: debug-build
        path: build/

    - name: Restore executable permissions
      run: |
        chmod -R +x build/bin

    - name: Run tests with timing output and analyze
      run: python3 .github/scripts/analyze_test_timing.py
      env:
        BUILD_DIR: build
        TOP_N: 50

    - name: Upload timing analysis results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-timing-analysis
        path: build/timing_results/

  docs:
    name: Build Documentation
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      # No submodules needed: Doxygen only scans include/tether and src.

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y doxygen graphviz
        python3 -m pip install -r docs/requirements.txt

    - name: Build HTML documentation
      # Exhale executes Doxygen automatically during the Sphinx build
      # (exhaleExecutesDoxygen in docs/conf.py) and generates the full
      # API .rst tree under docs/api/ — no separate doxygen step needed.
      # -j 1 keeps the build serial: parallel readers each carry a divergent
      # copy of the growing Sphinx environment (fork CoW is defeated by
      # CPython refcounting), which OOM-killed the 16 GB ubuntu-latest
      # runner at ~47% of "reading sources" on every run. Serial peaks ~4 GB.
      # -W --keep-going: treat Sphinx/Breathe warnings (missing toctree
      # entries, unresolved doxygenclass targets, dead myst xrefs) as
      # errors so the docs can't silently rot again.
      run: |
        mkdir -p build
        sphinx-build -W --keep-going -j 1 -b html docs build/docs/html

    # Stage each artifact under its own parent so every zip has exactly one
    # top-level directory (documentation/, doc-coverage/) — keeps downloads
    # tidy and avoids flat 14k-file archives.
    - name: Package artifacts
      run: |
        mkdir -p pkg-site/documentation pkg-cov/doc-coverage
        cp -a build/docs/html/. pkg-site/documentation/
        python3 scripts/doc_coverage_report.py \
            --warnings build/doxygen-warnings.txt \
            --out pkg-cov/doc-coverage

    - name: Upload documentation artifact
      uses: actions/upload-artifact@v7
      with:
        name: documentation
        path: pkg-site

    - name: Upload doc-coverage artifact
      uses: actions/upload-artifact@v7
      with:
        name: doc-coverage
        path: pkg-cov

  deploy-docs:
    name: Deploy documentation to netcup
    runs-on: ubuntu-latest
    needs: docs
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
    - name: Download documentation artifact
      uses: actions/download-artifact@v8
      with:
        name: documentation
        path: site

    # The artifact carries the pkg-site staging dir: site/documentation/
    # here is the complete sphinx HTML tree.
    - name: Install lftp
      run: |
        sudo apt-get update
        sudo apt-get install -y lftp

    # netcup webhosting has no SSH/rsync for this account — mirror over
    # FTPS instead. --delete removes remote files that no longer exist so
    # renamed/deleted pages can't linger. .well-known is excluded: it
    # holds the live ACME/Let's Encrypt challenges, deleting it would
    # break TLS renewal for tether.techoverflow.net.
    - name: Mirror site to netcup via FTPS
      run: |
        lftp -u "$NETCUP_FTP_USER","$NETCUP_FTP_PASSWORD" \
          -e "set ftp:ssl-force true; set net:max-retries 3; \
              mirror --reverse --delete --verbose --parallel=8 \
                --exclude '^\.well-known(/|$)' \
                site/documentation httpdocs; bye" \
          "$NETCUP_FTP_HOST"
      env:
        NETCUP_FTP_HOST: ${{ secrets.NETCUP_FTP_HOST }}
        NETCUP_FTP_USER: ${{ secrets.NETCUP_FTP_USER }}
        NETCUP_FTP_PASSWORD: ${{ secrets.NETCUP_FTP_PASSWORD }}

  static-analysis:
    name: Clang-Tidy & Clang Static Analyzer
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Hash submodule pins
      id: submod-key
      run: echo "hash=$(git ls-tree HEAD dependencies | git hash-object --stdin)" >> "$GITHUB_OUTPUT"

    - name: Restore submodule object cache
      id: submodule-cache
      uses: actions/cache/restore@v6
      with:
        path: .git/modules
        # Key on the pinned submodule commits (gitlinks), not the commit
        # SHA: one cache entry per submodule pin-set instead of one per
        # commit per job. Per-SHA entries wrote ~123 MB x N jobs every
        # push, exceeding the 10 GB quota and evicting the ccache entries.
        key: submodules-${{ steps.submod-key.outputs.hash }}
        restore-keys: submodules-

    - name: Update submodules
      run: git submodule update --init --recursive

    - name: Save submodule object cache
      uses: actions/cache/save@v6
      if: steps.submodule-cache.outputs.cache-hit != 'true'
      with:
        path: .git/modules
        key: submodules-${{ steps.submod-key.outputs.hash }}

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          clang \
          clang-tidy \
          clang-tools \
          lld \
          mold \
          ninja-build \
          ccache \
          libboost-dev \
          python3

    - name: Restore ccache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ccache
        key: ccache-${{ github.job }}-${{ github.sha }}
        restore-keys: ccache-${{ github.job }}-

    # compile_commands.json drives clang-tidy; tests/examples off — the
    # analysis surface is the library itself (src/, include/ via headers).
    - name: Configure with clang
      run: |
        # mold is the fastest supported linker (needs GCC 12+/clang);
        # GCC 11 (ubuntu-22.04) rejects -fuse-ld=mold, so fall back to lld.
        if echo 'int main(){}' | clang++ -x c++ - -fuse-ld=mold -o /tmp/ldprobe 2>/dev/null; then
          LINKER_FLAG=-fuse-ld=mold
        else
          LINKER_FLAG=-fuse-ld=lld
        fi
        echo "Using linker: $LINKER_FLAG"
        echo "LINKER_FLAG=$LINKER_FLAG" >> "$GITHUB_ENV"
        cmake -S . -B build-sa -G Ninja \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_CXX_COMPILER=clang++ \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DCMAKE_EXE_LINKER_FLAGS="$LINKER_FLAG" \
          -DCMAKE_SHARED_LINKER_FLAGS="$LINKER_FLAG" \
          -DCMAKE_MODULE_LINKER_FLAGS="$LINKER_FLAG" \
          -DTETHER_BUILD_TESTS=OFF \
          -DTETHER_BUILD_EXAMPLES=OFF \
          -DTETHER_BUILD_PYTHON_BINDINGS=OFF \
          -DTETHER_BUILD_EXTRACT_ESI=OFF
        # The build also proves the tree compiles under clang (libstdc++).
        cmake --build build-sa -j8
      env:
        CCACHE_DIR: ~/.cache/ccache

    - name: Run clang-tidy
      run: |
        # One clang-tidy invocation per TU of the library itself, parallel
        # via xargs. Warnings land in clang-tidy.log; the step never fails —
        # this job reports findings, it does not gate merges yet.
        grep -oE '"file": *"[^"]+\.(cpp|cc|cxx)"' build-sa/compile_commands.json \
          | sed 's/.*"\(.*\)"/\1/' \
          | grep -v '/_deps/\|/dependencies/\|/examples/' \
          | sort -u > sa_files.txt
        wc -l sa_files.txt
        xargs -a sa_files.txt -P $(nproc) -I{} \
          clang-tidy -p build-sa {} >> clang-tidy.log 2>&1 || true
        # Summarize: check name -> count, file -> count.
        { echo "## clang-tidy summary"; echo;
          echo "- total diagnostics: $(grep -c 'warning:\|error:' clang-tidy.log || true)";
          echo; echo "### By check"; echo '```';
          grep -oE '\[[a-z0-9-]+\]' clang-tidy.log | sort | uniq -c | sort -rn | head -25;
          echo '```'; } >> "$GITHUB_STEP_SUMMARY"

    - name: Run Clang Static Analyzer (scan-build)
      run: |
        # scan-build wraps the compiler: configure inside it so the
        # ccc-analyzer interposition applies to every TU.
        rm -rf build-csa
        scan-build -o scan-report \
          cmake -S . -B build-csa -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_EXE_LINKER_FLAGS="$LINKER_FLAG" \
            -DCMAKE_SHARED_LINKER_FLAGS="$LINKER_FLAG" \
            -DCMAKE_MODULE_LINKER_FLAGS="$LINKER_FLAG" \
            -DTETHER_BUILD_TESTS=OFF \
            -DTETHER_BUILD_EXAMPLES=OFF \
            -DTETHER_BUILD_PYTHON_BINDINGS=OFF
        # --status-bugs makes scan-build exit nonzero on findings; report
        # only for now — findings still land in the HTML artifact.
        scan-build -o scan-report --status-bugs \
          cmake --build build-csa -j8 || true

    - name: Upload analysis reports
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: static-analysis-reports
        path: |
          clang-tidy.log
          sa_files.txt
          scan-report/
