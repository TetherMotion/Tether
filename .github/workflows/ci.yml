          gcc \
          libc6-dev \
          make \
          ccache
    
    - name: Configure ccache
      run: |
        echo "CCACHE_DIR=~/.cache/ccache" >> $GITHUB_ENV
        ccache -M 5G
        ccache -s
    
    - name: Configure and build with TSAN
      run: |
        SANITIZER_FLAGS="-fsanitize=thread -g"
        
        cmake -S . -B build-tsan \
          -DCMAKE_BUILD_TYPE=Debug \
          -DTETHER_BUILD_TESTS=ON \
          -DTETHER_BUILD_MODULE_TESTS=ON \
          -DTETHER_BUILD_DESTABILIZER=ON \
          -DTETHER_BUILD_PYTHON_BINDINGS=OFF \
          -DTETHER_BUILD_EXTRACT_ESI=OFF \
          -DCMAKE_CXX_FLAGS="${SANITIZER_FLAGS}" \
          -DCMAKE_C_FLAGS="${SANITIZER_FLAGS}" \
          -DCMAKE_EXE_LINKER_FLAGS="${SANITIZER_FLAGS}" \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          
        modules=("control" "destabilizer" "simulation" "motion" "motion_planner" "slave" "esi" "export")
        for module in "${modules[@]}"; do
          cmake --build build-tsan --target tether_${module}_tests --parallel $(nproc)
        done
    
    - name: Run all module tests with TSAN in parallel
      run: |
        export TSAN_OPTIONS=halt_on_error=0
        
        modules=("control" "destabilizer" "simulation" "motion" "motion_planner" "slave" "esi" "export")
        pids=()
        
        for module in "${modules[@]}"; do
          echo "Running $module with TSAN..."
          ctest --test-dir build-tsan \
            --output-on-failure \
            -R "^tether_${module}_tests" > "tsan_${module}.log" 2>&1 &
          pids+=($!)
        done
        
        failed=()
        for i in "${!pids[@]}"; do
          if ! wait "${pids[$i]}"; then
            failed+=("${modules[$i]}")
          fi
        done
        
        echo "=== TSAN Test Results ==="
        for module in "${modules[@]}"; do
          echo "--- $module (TSAN) ---"
          cat "tsan_${module}.log"
        done
        
        if [ ${#failed[@]} -gt 0 ]; then
          echo "Failed modules with TSAN: ${failed[*]}"
          exit 1
        fi
    
    - name: Show ccache stats
      if: always()
      run: ccache -s
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: tsan-test-results
        path: tsan_*.log

  analyze-test-timing:
    name: Analyze Test Timing
    runs-on: ubuntu-latest
    needs: compile

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: debug-build
        path: build/

    - name: Restore executable permissions
      run: |
        chmod -R +x build/bin

    - name: Run tests with timing output and analyze
      run: python3 .github/scripts/analyze_test_timing.py
      env:
        BUILD_DIR: build
        TOP_N: 50

    - name: Upload timing analysis results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-timing-analysis
        path: build/timing_results/
