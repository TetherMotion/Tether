name: Compile

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  compile:
    name: Compile Tether
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          g++ \
          gcc \
          libc6-dev \
          make
    
    - name: Build
      run: |
        ./build.sh -d build -t Release
    
    - name: Verify build artifacts
      run: |
        ls -la build/bin/
        ls -la build/lib/
