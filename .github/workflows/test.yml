name: Test

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          cmake \
          g++ \
          gcc \
          libc6-dev \
          make
    
    - name: Configure and build
      run: |
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DTETHER_BUILD_TESTS=ON -DTETHER_BUILD_PYTHON_BINDINGS=OFF
        cmake --build build --parallel $(nproc)
    
    - name: Run tests
      run: |
        ctest --test-dir build --output-on-failure
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: build/Testing/
