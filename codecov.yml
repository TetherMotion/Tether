coverage:
  status:
    project:
      default:
        target: 100%
        threshold: 0.01%

ignore:
  - "examples"
  - "examples/**/*"
  - "tests"
  - "tests/**/*"
  - "tools"
  - "tools/**/*"

comment:
  layout: "diff, flags, files"
  behavior: default

# Per-module coverage tracking — mirrors the CMake component layout
# (cmake/components/*.cmake). Each component_id shows up under
# app.codecov.io/gh/TetherMotion/Tether/components.
component_management:
  individual_components:
    - component_id: tether_common
      name: tether_common
      paths:
        - src/common/**
        - src/logging/**
        - src/platform/**
        - include/tether/common/**
        - include/tether/platform/**
        - include/tether/utils/**
        - include/tether/Tether.hpp
    - component_id: tether_io
      name: tether_io
      paths:
        - src/io/**
        - include/tether/io/**
    - component_id: tether_ethercat
      name: tether_ethercat
      paths:
        - src/ethercat/**
        - src/fmmu/**
        - src/sii/**
        - src/reset/**
        - include/tether/ethercat/**
        - include/tether/fmmu/**
        - include/tether/sii/**
        - include/tether/reset/**
    - component_id: tether_slave
      name: tether_slave
