# Nginx proxy config for Mainsail -> Tether (host).
#
# Tether runs on the host (not in Docker).  The Mainsail container reaches
# the host via the "host.docker.internal" alias, which is mapped to
# host-gateway in docker-compose.yml.  On Linux this resolves to the Docker
# bridge gateway IP (typically 172.17.0.1).

location /websocket {
    proxy_pass http://host.docker.internal:7125/websocket;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 86400;
}

location /api {
    proxy_pass http://host.docker.internal:7125;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

location /server {
    proxy_pass http://host.docker.internal:7125;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

location /machine {
    proxy_pass http://host.docker.internal:7125;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

location /access {
    proxy_pass http://host.docker.internal:7125;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

location /client {
    proxy_pass http://host.docker.internal:7125;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}
